  #   url: https://apinebula.ai/v1
  #   provider: generic
  #   key: sk-REPLACE_ME
  #   model: claude-sonnet-5
  #   mode: anthropic-messages
  #   order: 91
  #   rule: never
  #   headers:
  #     user-agent: claude-cli/2.1.0 (external, cli)
  #   quota: { probe: none }

